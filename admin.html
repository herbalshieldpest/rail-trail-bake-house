<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen · Rail Trail Bakehouse</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--frame:#1b2e31;--card:#f1ebe0;--paper:#f7f3eb;--ink:#2a1c13;--muted:#6b5a4b;--line:#c3b5a0;--soft:#e6d9c6;--green:#2f4a37;--gilt:#e2cf9f;--red:#9a3b2b;--ok:#3d6b4a}
*{box-sizing:border-box}
body{margin:0;padding:0 clamp(0px,2vw,24px);background:var(--frame);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;box-sizing:border-box;padding:16px clamp(18px,3vw,36px);color:var(--card)}
header .brand{display:flex;align-items:baseline;gap:16px}header .logo{color:var(--card);display:block}
header .brand b{font-weight:500;font-size:22px;letter-spacing:.02em}
header .brand span{font-variant:small-caps;letter-spacing:.12em;color:var(--gilt);font-size:15px;border-left:1px solid rgba(241,235,224,.3);padding-left:16px;line-height:1.15;position:relative;top:-2.3px}
header .who{font-size:14px;opacity:.85;display:flex;gap:14px;align-items:center}
header .who button{background:none;border:1px solid rgba(241,235,224,.4);color:var(--card);border-radius:4px;padding:4px 10px;cursor:pointer}
main{max-width:1180px;margin:0 auto 40px;background:var(--card);border-radius:10px;min-height:70vh;padding:clamp(18px,3vw,36px)}
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:28px;letter-spacing:.02em}
h2{font-size:22px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);margin:0 0 22px}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-variant:small-caps;letter-spacing:.1em;font-size:16px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--green)}
.btn{background:var(--green);color:var(--gilt);border:none;border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;font-variant:small-caps;letter-spacing:.08em;outline:1px dashed rgba(226,207,159,.7);outline-offset:-4px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);outline:none;border:1px solid var(--line)}
.btn.warn{background:var(--red);color:#fff;outline-color:rgba(255,255,255,.5)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
label.f,div.f{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
label.f>span,div.f>span{display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-variant:small-caps;letter-spacing:.08em;color:var(--muted);font-size:15px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--soft);vertical-align:top}
td input,td select{min-width:70px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-variant:small-caps;letter-spacing:.08em;border:1px solid currentColor}
.pill.published{color:var(--ok)}.pill.draft{color:var(--muted)}.pill.archived{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--soft);border-radius:8px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.dt{display:flex;gap:8px}.dt input{min-width:0;flex:1 1 0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:38px;line-height:1.3}.dt input[type=time]{flex:0 1 9em}
input,select,textarea{max-width:100%;box-sizing:border-box}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--frame);color:var(--card);padding:10px 18px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10;font-size:15px}
.toast.err{background:var(--red)}
.center{max-width:380px;margin:60px auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.hide{display:none!important}
.stops{list-style:none;margin:0;padding:0}
a.btn{text-decoration:none}.stops a{color:var(--ink)}
.stop{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start;padding:14px 0;border-top:1px solid var(--soft)}
.stop-n{width:32px;height:32px;border-radius:50%;background:var(--frame);color:var(--card);display:flex;align-items:center;justify-content:center;font-weight:600}
.stop.done{opacity:.55}.stop.done .stop-n{background:var(--ok)}
.stop-addr{display:block;color:var(--ink);margin:2px 0}
.stop-note{font-size:15px;background:#f6ecd6;border-radius:4px;padding:2px 8px;margin:4px 0;display:inline-block}
.stop-items{margin:6px 0 0;padding-left:18px;font-size:15px}
.stop-act{display:flex;gap:6px;align-items:center}.stop-act .btn{padding:8px 12px}
@media (max-width:600px){.stop{grid-template-columns:auto 1fr}.stop-act{grid-column:1/-1;justify-content:flex-end}}
@media print{.stop{break-inside:avoid}.stop-n{background:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.ph-prev{aspect-ratio:4/3;max-width:360px;border:1px dashed var(--line);border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-style:italic}
.ph-prev img{width:100%;height:100%;object-fit:cover;display:block}
.thumb{flex:none;width:44px;height:44px;border-radius:6px;background:var(--soft);overflow:hidden;display:block}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cam{display:none}@media (pointer:coarse){.cam{display:inline-block}}
.show-sm{display:none}@media (max-width:700px){.show-sm{display:block}}
.order{border-top:1px solid var(--soft);padding:14px 0}
.order:first-child{border-top:none}
.price-in{max-width:100px}
@media (max-width:700px){td,th{padding:6px 4px}.hide-sm{display:none}}
.who .navbtn{display:none;background:none;border:none;padding:0;color:var(--card);width:40px;height:40px;margin-right:-8px;cursor:pointer;align-items:center;justify-content:center}
.navbtn .x{display:none}body.nav-open .navbtn .x{display:inline}body.nav-open .navbtn .b{display:none}
@media (max-width:600px){#whoEmail{display:none}header .logo svg{height:30px!important}header .brand span{top:-1.2px}header .brand{gap:12px}header{padding-top:12px;padding-bottom:12px}.who .navbtn{display:flex}#signOut{display:none}nav.tabs{display:none;flex-direction:column;border-bottom:1px solid var(--line);margin:-6px 0 20px}body.nav-open nav.tabs{display:flex}nav.tabs button{text-align:left;padding:13px 2px;font-size:17px;border-bottom:1px solid var(--soft);border-left:3px solid transparent;padding-left:10px}nav.tabs button[aria-selected=true]{border-bottom-color:var(--soft);border-left-color:var(--green)}nav.tabs .tab-out{display:block;color:var(--red)}}
.tab-out{display:none}.cur-tab{display:none;font-variant:small-caps;letter-spacing:.1em;color:var(--muted);font-size:15px;margin:-4px 0 12px}
@media print{
 body{background:#fff}header,nav.tabs,.no-print,.toast{display:none!important}
 main{border-radius:0;padding:0;max-width:none}
 .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
