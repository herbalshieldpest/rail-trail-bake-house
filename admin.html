<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen · Rail Trail Bakehouse</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--frame:#1b2e31;--card:#f1ebe0;--paper:#f7f3eb;--ink:#2a1c13;--muted:#6b5a4b;--line:#c3b5a0;--soft:#e6d9c6;--green:#2f4a37;--gilt:#e2cf9f;--red:#9a3b2b;--ok:#3d6b4a}
*{box-sizing:border-box}
body{margin:0;background:var(--frame);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,3vw,32px);color:var(--card)}
header .brand{display:flex;align-items:baseline;gap:12px}
header .brand b{font-weight:500;font-size:22px;letter-spacing:.02em}
header .brand span{font-variant:small-caps;letter-spacing:.12em;color:var(--gilt);font-size:15px}
header .who{font-size:14px;opacity:.85;display:flex;gap:14px;align-items:center}
header .who button{background:none;border:1px solid rgba(241,235,224,.4);color:var(--card);border-radius:4px;padding:4px 10px;cursor:pointer}
main{max-width:1180px;margin:0 auto 40px;background:var(--card);border-radius:10px;min-height:70vh;padding:clamp(18px,3vw,36px)}
h1,h2,h3{font-weight:500;margin:0}
h1{font-size:28px;letter-spacing:.02em}
h2{font-size:22px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
nav.tabs{display:flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px solid var(--line);margin:0 0 22px}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-variant:small-caps;letter-spacing:.1em;font-size:16px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--green)}
.btn{background:var(--green);color:var(--gilt);border:none;border-radius:4px;padding:9px 16px;cursor:pointer;font-weight:600;font-variant:small-caps;letter-spacing:.08em;outline:1px dashed rgba(226,207,159,.7);outline-offset:-4px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);outline:none;border:1px solid var(--line)}
.btn.warn{background:var(--red);color:#fff;outline-color:rgba(255,255,255,.5)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
textarea{min-height:60px;resize:vertical}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
label.f>span{display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-variant:small-caps;letter-spacing:.08em;color:var(--muted);font-size:15px;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--soft);vertical-align:top}
td input,td select{min-width:70px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-variant:small-caps;letter-spacing:.08em;border:1px solid currentColor}
.pill.published{color:var(--ok)}.pill.draft{color:var(--muted)}.pill.archived{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--soft);border-radius:8px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--frame);color:var(--card);padding:10px 18px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10;font-size:15px}
.toast.err{background:var(--red)}
.center{max-width:380px;margin:60px auto}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.hide{display:none!important}
.show-sm{display:none}@media (max-width:700px){.show-sm{display:block}}
.order{border-top:1px solid var(--soft);padding:14px 0}
.order:first-child{border-top:none}
.price-in{max-width:100px}
@media (max-width:700px){td,th{padding:6px 4px}.hide-sm{display:none}}
.who .navbtn{display:none;background:none;border:none;padding:0;color:var(--card);width:40px;height:40px;margin-right:-8px;cursor:pointer;align-items:center;justify-content:center}
.navbtn .x{display:none}body.nav-open .navbtn .x{display:inline}body.nav-open .navbtn .b{display:none}
@media (max-width:600px){#whoEmail{display:none}header .brand b{font-size:19px}header{padding-top:12px;padding-bottom:12px}.who .navbtn{display:flex}#signOut{display:none}nav.tabs{display:none;flex-direction:column;border-bottom:1px solid var(--line);margin:-6px 0 20px}body.nav-open nav.tabs{display:flex}nav.tabs button{text-align:left;padding:13px 2px;font-size:17px;border-bottom:1px solid var(--soft);border-left:3px solid transparent;padding-left:10px}nav.tabs button[aria-selected=true]{border-bottom-color:var(--soft);border-left-color:var(--green)}nav.tabs .tab-out{display:block;color:var(--red)}}
.tab-out{display:none}.cur-tab{display:none;font-variant:small-caps;letter-spacing:.1em;color:var(--muted);font-size:15px;margin:-4px 0 12px}
@media print{
 body{background:#fff}header,nav.tabs,.no-print,.toast{display:none!important}
 main{border-radius:0;padding:0;max-width:none}
 .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>

  <div class="brand"><b>Rail Trail Bakehouse</b><span>kitchen</span></div>
  <div class="who hide" id="who"><span id="whoEmail"></span><button id="signOut" type="button">Sign out</button><button class="navbtn" id="navBtn" type="button" aria-label="Menu" aria-expanded="false"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path class="b" d="M4 8h18M4 13h18M4 18h18"/><path class="x" d="M6 6l14 14M20 6L6 20"/></svg></button></div>
</header>
<main id="app"><p class="muted">Loading…</p></main>

<script>
(function () {

        if (a.error || !a.data) {

  }

  // ---------- data ----------

  // ---------- layout ----------

    return sel;
  }

  // ---------- weekly menu ----------
  function viewWeek(root) {

    var newBtn = h('button', { class: 'btn ghost', type: 'button', text: '+ Start next week', onclick: function () {
      newBtn.disabled = true;
      sb.rpc('create_next_week').then(function (r) { newBtn.disabled = false; check(r); state.weekId = r.data; toast('Next week created as a draft'); loadAll().then(render); });
    } });
    root.appendChild(h('div', { class: 'spread' },
      h('div', {}, h('h1', { text: 'Weekly menu' }), h('p', { class: 'muted small', text: 'Pick the bakes for a delivery Tuesday, set prices, then publish it so customers see it on Wednesday.' })),
      h('div', { class: 'row no-print' }, state.weeks.length ? weekPicker(render) : null, newBtn)));
    if (!w) { root.appendChild(h('div', { class: 'empty', text: 'No weeks yet. Start one above.' })); return; }

    } });

      saveTimes.disabled = true;
      sb.from('weeks').update({ opens_at: fromLocalInput(opens.value), closes_at: fromLocalInput(closes.value), note: note.value }).eq('id', w.id)

    root.appendChild(h('div', { class: 'grid2', style: 'margin-bottom:22px' },

        pubBtn),
      h('div', { class: 'card' },
        h('label', { class: 'f' }, h('span', { text: 'Menu goes up (Eastern time)' }), opens),
        h('label', { class: 'f' }, h('span', { text: 'Orders close (Eastern time)' }), closes),
        h('label', { class: 'f' }, h('span', { text: 'Note' }), note), saveTimes)));

    var list = h('div');
    root.appendChild(h('h2', { text: 'On the menu' }));
    root.appendChild(list);
    sb.from('week_items').select('*').eq('week_id', w.id).order('sort').then(function (r) {
      var items = check(r) || [];
      var onIds = items.map(function (i) { return i.product_id; });
      if (!items.length) list.appendChild(h('div', { class: 'empty', text: 'Nothing on this week’s menu yet. Add a bake below.' }));
      else list.appendChild(h('table', {},
        h('thead', {}, h('tr', {}, h('th', { text: 'Bake' }), h('th', { text: 'Price' }), h('th', { class: 'hide-sm', text: 'Limit' }), h('th', { class: 'hide-sm', text: 'Featured' }), h('th', { text: '' }))),
        h('tbody', {}, items.map(function (it) {

        list.appendChild(h('div', { class: 'row no-print', style: 'margin-top:14px' }, sel, h('button', { class: 'btn', type: 'button', text: 'Add to menu', onclick: function () {

      }
      list.appendChild(h('p', { class: 'small muted', style: 'margin-top:10px', text: 'Leave a price blank to use the bake’s usual price. Leave the limit blank for no limit. Changes save as you leave each box.' }));
    });
  }
  function toLocalInput(ts) {
    var d = new Date(ts);
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
    var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
    return o.year + '-' + o.month + '-' + o.day + 'T' + (o.hour === '24' ? '00' : o.hour) + ':' + o.minute;

  // ---------- orders ----------
